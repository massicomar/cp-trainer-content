name: Deploy content

# After "Validate content" passes on a push to main: pull this repo on the VPS
# and sync it into the running app. No app rebuild; new problems are live in
# seconds. Setup: docs/deploy.md in the cp-trainer app repo.
on:
  workflow_run:
    workflows: [Validate content]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-content
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Pull and sync on the VPS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }} # the app checkout on the VPS
        run: |
          : "${DEPLOY_PATH:?Set the DEPLOY_PATH repository variable (see the app repo's docs/deploy.md)}"
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "$DEPLOY_PATH/scripts/sync-content.sh"
